# ── CampusBrain — Docker Compose ──────────────────────────────────────────────
# Service: backend API only
# Database: use an external hosted Postgres (e.g. Neon, Supabase, Railway)
# The Streamlit RAG app is a separate deployed service (not included here).
#
# Quick start:
#   1. cp backend/.env.example backend/.env   # fill in secrets + DATABASE_URL
#   2. docker compose up --build

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusbrain_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
